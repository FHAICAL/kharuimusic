<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KharuiMusic</title>
</head>
<body>
<header id="topbar">
  <div class="logo">🎵 Kharui<span>Music</span></div>
  <div class="top-actions">
    <button id="btnLog" class="icon-btn" title="Log diagnostik">🧾</button>
    <button id="btnAccount" class="account-btn">Masuk</button>
  </div>
</header>

<main>
  <!-- JELAJAH -->
  <section id="view-explore" class="view">
    <form id="searchForm" class="search-row">
      <input id="q" type="search" placeholder="Cari lagu, artis, album…" autocomplete="off" />
      <button type="submit">Cari</button>
    </form>
    <div id="homeSections">
      <h2 class="sec-title">Mulai cepat</h2>
      <div class="chips-row">
        <button class="qchip" data-q="Dewa 19">Dewa 19</button>
        <button class="qchip" data-q="Peterpan">Peterpan</button>
        <button class="qchip" data-q="Sheila On 7">Sheila On 7</button>
        <button class="qchip" data-q="Coldplay">Coldplay</button>
        <button class="qchip" data-q="Lo-fi beats">Lo-fi</button>
      </div>
      <div id="recentWrap" hidden>
        <h2 class="sec-title">Terakhir diputar</h2>
        <div id="recentList"></div>
      </div>
      <p class="hint">Cari lagu di atas, lalu ketuk untuk memutar. Hasil pencarian otomatis menjadi antrean.</p>
    </div>
    <div id="resultsWrap" hidden>
      <h2 class="sec-title" id="resultsTitle">Hasil</h2>
      <div id="results"></div>
      <button id="btnBackHome" class="ghost full">← Kembali</button>
    </div>
  </section>

  <!-- LIBRARY -->
  <section id="view-library" class="view" hidden>
    <h2 class="sec-title">Library kamu</h2>
    <div id="libraryBody">
      <p class="hint" id="libraryHint">Memuat…</p>
      <div id="libraryList"></div>
    </div>
  </section>

  <!-- PLAYLIST -->
  <section id="view-playlist" class="view" hidden>
    <button id="btnBackLibrary" class="ghost">← Library</button>
    <div class="pl-head">
      <img id="plThumb" alt="" />
      <div>
        <div id="plTitle" class="pl-title"></div>
        <div id="plSub" class="pl-sub"></div>
      </div>
    </div>
    <button id="btnPlayAll" class="full">▶ Putar Semua</button>
    <div id="plSongs"></div>
  </section>
</main>

<!-- MINI PLAYER -->
<div id="miniPlayer" hidden>
  <img id="miniThumb" alt="" />
  <div class="mini-meta" id="miniMeta">
    <div id="miniTitle" class="mini-title">—</div>
    <div id="miniArtist" class="mini-artist">—</div>
  </div>
  <button id="btnMiniPrev" class="icon-btn">⏮</button>
  <button id="btnMiniPlay" class="icon-btn big">▶</button>
  <button id="btnMiniNext" class="icon-btn">⏭</button>
  <div id="miniProgress"><div id="miniProgressBar"></div></div>
</div>

<!-- NOW PLAYING -->
<div id="nowPlayingSheet" hidden>
  <div class="np-top">
    <button id="btnCloseNp" class="icon-btn">⌄</button>
    <div class="np-source" id="npSource">KharuiMusic</div>
    <button id="btnQueueToggle" class="icon-btn" title="Antrean">☰</button>
  </div>
  <img id="npThumb" alt="" />
  <div id="npTitle" class="np-title">—</div>
  <div id="npArtist" class="np-artist">—</div>
  <input id="npSeek" type="range" min="0" max="1000" value="0" />
  <div class="np-times"><span id="npCur">0:00</span><span id="npDur">0:00</span></div>
  <div class="np-controls">
    <button id="btnShuffle" class="icon-btn toggle">🔀</button>
    <button id="btnPrev" class="icon-btn big">⏮</button>
    <button id="btnPlay" class="icon-btn huge">▶</button>
    <button id="btnNext" class="icon-btn big">⏭</button>
    <button id="btnRepeat" class="icon-btn toggle">🔁</button>
  </div>
  <div id="npStatus" class="np-status"></div>
  <div id="queueWrap" hidden>
    <h3>Antrean</h3>
    <div id="queueList"></div>
  </div>
</div>

<!-- LOG DRAWER -->
<div id="logDrawer" hidden>
  <div class="log-head">
    <b>Log diagnostik</b>
    <div>
      <button id="btnCopyLog" class="ghost">📋 Salin</button>
      <button id="btnClearLog" class="ghost">Bersihkan</button>
      <button id="btnCloseLog" class="ghost">Tutup</button>
    </div>
  </div>
  <div id="log"></div>
</div>

<!-- ACCOUNT SHEET -->
<div id="accountSheet" hidden>
  <h3>Akun</h3>
  <div id="accountInfo" class="hint">Belum masuk.</div>
  <div class="col-gap">
    <button id="btnLogin" class="full">Masuk dengan Google</button>
    <button id="btnLogout" class="ghost full">Keluar / Hapus Sesi</button>
    <button id="btnCloseAccount" class="ghost full">Tutup</button>
  </div>
  <details>
    <summary class="hint">Cadangan: tempel cookie manual</summary>
    <textarea id="cookiePaste" rows="3" placeholder="Cookie dari music.youtube.com (nama=nilai; nama=nilai; ...)"></textarea>
    <button id="btnPasteCookie" class="ghost full">Simpan Cookie</button>
  </details>
</div>

<nav id="bottomNav">
  <button id="navExplore" class="nav-btn active">🏠<span>Jelajah</span></button>
  <button id="navLibrary" class="nav-btn">📚<span>Library</span></button>
</nav>

<audio id="player" preload="auto"></audio>
<script type="module" src="/src/main.js"></script>
</body>
</html>
